[server]
port = 8501
headless = true
baseUrlPath = "/cotizacion"
enableXsrfProtection = true
maxUploadSize = 500
# Importante: Reconocer headers de proxy inverso
enableCORS = false
trustXForwardedProto = true
trustXForwardedHost = true
trustXForwardedPort = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
showErrorDetails = true

[logger]
level = "debug"

[theme]
primaryColor = "#1f77b4"
